services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmd_user
      POSTGRES_PASSWORD: pmd_password
      POSTGRES_DB: pmd_control_hub
    ports:
      - "5432:5432"
    volumes:
      - pmd_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmd_user -d pmd_control_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://pmd_user:pmd_password@db:5432/pmd_control_hub?schema=public"
      SESSION_SECRET: "change-me-to-a-long-random-string"
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pmd_db_data:
