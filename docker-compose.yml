services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmd_user
      POSTGRES_PASSWORD: pmd_password
      POSTGRES_DB: pmd_control_hub
    ports:
      - "5432:5432"
    volumes:
      - pmd_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmd_user -d pmd_control_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prepara la base antes de que arranque la app: aplica migraciones y siembra
  # catálogos, roles y el usuario inicial. Corre una vez y termina; la imagen
  # de la app no trae el CLI de Prisma, por eso usa el stage `builder`.
  # El seed es idempotente, así que repetirlo en cada `up` es seguro.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://pmd_user:pmd_password@db:5432/pmd_control_hub?schema=public"
      DIRECT_URL: "postgresql://pmd_user:pmd_password@db:5432/pmd_control_hub?schema=public"
    command: >
      sh -c "npx prisma migrate deploy --schema db/prisma/schema.prisma &&
             npx tsx db/prisma/seed.ts"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://pmd_user:pmd_password@db:5432/pmd_control_hub?schema=public"
      DIRECT_URL: "postgresql://pmd_user:pmd_password@db:5432/pmd_control_hub?schema=public"
      AUTH_DISABLED: "${AUTH_DISABLED:-true}"
      # Cambiar por una cadena larga y aleatoria antes de exponer esto a nadie
      # más: firma las sesiones. `openssl rand -base64 48` sirve.
      SESSION_SECRET: "${SESSION_SECRET:-change-me-to-a-long-random-string}"
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pmd_db_data:
